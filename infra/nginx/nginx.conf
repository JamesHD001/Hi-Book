# Hi!Book self-hosted reverse-proxy baseline.
# This file is an optional deployment configuration for a VPS/container host.
# Vercel deployments already sit behind Vercel's managed edge/reverse-proxy layer.
# Replace example.com and TLS certificate paths before production use.

events {}

http {
  limit_req_zone $binary_remote_addr zone=hibook_general:10m rate=10r/s;

  upstream hibook_web {
    server 127.0.0.1:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;
    client_body_timeout 15s;
    send_timeout 30s;

    limit_req zone=hibook_general burst=30 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      proxy_pass http://hibook_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_buffering on;
    }
  }
}
