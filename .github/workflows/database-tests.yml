name: Hi!Book database tests

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-tests.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/database-tests.yml'

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start -x studio,inbucket,analytics,imgproxy,mailpit,edge-runtime,logflare,vector

      - name: Reset database and apply all migrations
        run: supabase db reset --local

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
